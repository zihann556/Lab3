<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 Grid Layout</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page-wrapper">

        <header class="header">
            <h1>My Website</h1>
        </header>

        <nav class="nav">
            <h2>Navigation</h2>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </nav>

        <main class="main">

            <div class="card-container">

                <article class="card card1">
                    <h2>Card 1</h2>
                    <p>first content</p>
                </article>

                <article class="card card2">
                    <h2>Card 2</h2>
                    <p>second content</p>
                </article>

                <article class="card card3">
                    <h2>Card 3</h2>
                    <p>third content</p>
                </article>

            </div>

        </main>

        <footer class="footer">
            <p>Footer</p>
        </footer>

    </div>

</body>

</html>
